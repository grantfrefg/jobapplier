[project]
name = "applypilot"
version = "0.14.1"
description = "AI-powered end-to-end job application pipeline"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{name = "Pickle-Pixel"}]
keywords = ["job-search", "automation", "ai", "resume", "apply", "job-application"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pypdf>=4.0",  # reading the text of your own resume PDFs (ATS check)
    "pdfplumber>=0.10",  # reading the design of your resume PDF (Resume look -> Match my resume)
    "python-docx>=1.1",  # filling your own Word resume (Resume look -> My Word file)
    "anthropic>=2.0",  # Claude, when you choose it as the AI provider (your own API key)
    "tzdata; sys_platform == 'win32'",  # Pacific time for the daily Gemini budget
    ]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
ui = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]

[project.scripts]
applypilot = "applypilot.cli:app"
jobapplier = "applypilot.cli:app"

[project.urls]
Homepage = "https://github.com/grantfrefg/jobapplier"
Repository = "https://github.com/grantfrefg/jobapplier"
Issues = "https://github.com/grantfrefg/jobapplier/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/applypilot"]

[tool.hatch.build]
artifacts = ["src/applypilot/config/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint.per-file-ignores]
# Long lines here are AI prompt text, page JavaScript or HTML: wrapping them would change
# what the AI is sent (and the UK swaps in market.py match these passages exactly).
"src/applypilot/apply/prompt.py" = ["E501"]
"src/applypilot/view.py" = ["E501"]
"src/applypilot/discovery/smartextract.py" = ["E501"]
"src/applypilot/enrichment/detail.py" = ["E501"]
"src/applypilot/scoring/scorer.py" = ["E501"]
"src/applypilot/scoring/tailor.py" = ["E501"]
"src/applypilot/scoring/cover_letter.py" = ["E501"]
