      from our Sydney CBD office.
      What you'll do: plan and run paid search and paid social (Google Ads, LinkedIn Ads, Meta);
      manage a $1.5M budget; work with sales on lead quality; report on pipeline and CAC.
      You have: 5+ years in performance marketing, B2B SaaS experience essential, hands-on Google Ads
      and LinkedIn Ads, HubSpot or similar, strong GA4 and reporting skills.
      Highly regarded: experience managing a small team or agency.
