# A made-up mid-level B2B performance marketer in Western Sydney. Australian citizen,
# full-time only, $130k minimum. The jobs cover each scoring rule for a marketing CV.
#
# Labels are a first draft written with the dataset. Review every score and change any you
# disagree with, then set labels_reviewed to true: the eval is only as good as its labels.
id: marketing_performance
country: australia
labels_reviewed: false
local_areas: ["Sydney NSW"]

profile:
  personal: {full_name: Sam Taylor, city: Parramatta, province_state: NSW, country: Australia}
  work_authorization:
    legally_authorized_to_work: "Yes"
    require_sponsorship: "No"
    work_permit_type: Australian citizen
  availability: {available_for_full_time: "Yes", available_for_contract: "No", willing_to_relocate: "No"}
  compensation: {salary_currency: AUD, salary_range_min: "130000", salary_expectation: "140000"}
  experience:
    years_of_experience_total: "5"
    current_job_title: Performance Marketing Manager
    target_role: Performance Marketing Manager
    industry: Marketing and communications

resume: |
  SAM TAYLOR
  Parramatta, NSW | sam.taylor@example.com

  SUMMARY
  B2B performance marketer with 5 years in SaaS and agency roles. I run paid search and paid social
  that turns into pipeline, and I report on revenue, not clicks.

  EXPERIENCE
  Performance Marketing Manager, Cloudline (B2B SaaS), Sydney | Mar 2022 - Present
  - Own a $1.2M annual paid budget across Google Ads, LinkedIn Ads and Meta Ads.
  - Cut cost per lead 32% in 12 months by rebuilding account structure and audiences.
  - Built HubSpot lead scoring with sales; MQL to SQL conversion up 18%.
  - Built GA4 and Looker Studio dashboards that tie spend to Salesforce pipeline.
  - Manage one paid media specialist and an external creative agency.

  Digital Marketing Specialist, Brightwave Digital (agency), Sydney | Feb 2019 - Feb 2022
  - Ran Google Ads and LinkedIn campaigns for 9 B2B clients in software and professional services.
  - Ran landing page A/B tests in Unbounce; average conversion rate up from 2.1% to 3.4%.
  - Wrote monthly performance reports and presented them to clients.

  EDUCATION
  Bachelor of Business (Marketing), University of Technology Sydney, 2018

  SKILLS
  Paid media: Google Ads, LinkedIn Ads, Meta Ads, Microsoft Ads
  Platforms: HubSpot, Salesforce, Unbounce, Google Tag Manager
  Analytics: GA4, Looker Studio, basic SQL, Excel

