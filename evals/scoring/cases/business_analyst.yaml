  personal: {full_name: Morgan Lee, city: Chatswood, province_state: NSW, country: Australia}
  work_authorization:
    legally_authorized_to_work: "Yes"
    require_sponsorship: "No"
    work_permit_type: Australian citizen
  availability: {available_for_full_time: "Yes", available_for_contract: "Yes", willing_to_relocate: "No"}
  compensation: {salary_currency: AUD, salary_range_min: "130000", salary_expectation: "145000"}
  experience:
    years_of_experience_total: "6"
