resume: |
  MORGAN LEE
  Chatswood, NSW | morgan.lee@example.com

  SUMMARY
  Business analyst with 6 years in banking and insurance, taking change from first workshop to go-live.

  EXPERIENCE
  Senior Business Analyst, Harbourview Bank, Sydney | Feb 2022 - Present
  - Led requirements workshops with operations, risk and product teams for a new home loan origination platform.
  - Wrote 300+ user stories with acceptance criteria in Jira and kept the backlog groomed with the product owner.
  - Mapped current and future state processes in BPMN (Visio); cut loan approval steps from 14 to 9.
  - Planned and ran UAT with 40 business testers; go-live with no priority-one defects.

  Business Analyst, Greystone Insurance, Sydney | Mar 2019 - Jan 2022
  - Gathered requirements and wrote business cases for a claims system upgrade ($4M program).
  - Did gap analysis between the old and new claims systems and wrote the data migration rules.
  - Built Power BI reports on claims turnaround for the operations manager; wrote SQL queries to check the data.

  EDUCATION
  Bachelor of Commerce (Information Systems), Macquarie University, 2018

  SKILLS
  Analysis: requirements elicitation, user stories, acceptance criteria, gap analysis, business cases
  Process: BPMN, process mapping, Visio
  Delivery: Agile (Scrum), UAT, stakeholder management
  Tools: Jira, Confluence, Power BI, SQL (basic), Excel

