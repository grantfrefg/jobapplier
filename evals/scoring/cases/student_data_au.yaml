      $45 per hour. Build Power BI dashboards and SQL reports for the merchandising team.
      You have: 1+ years in data analysis; SQL; Power BI or Tableau; Excel.
    label: {score: 9, dealbreaker: null,
            why: "Same work (SQL, Power BI dashboards, retail data), part-time within the hours limit, local."}

