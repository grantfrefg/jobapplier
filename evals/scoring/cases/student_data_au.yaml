# A made-up international student in Sydney: Master of Data Science (coursework) at a Sydney
# university, course ends November 2027, then a Temporary Graduate visa (485). Two years as a data
# analyst in Bengaluru before the degree, plus a casual cafe job now. Student visa: 48 hours a
# fortnight in session, unlimited in breaks (0.18.0). The jobs test what fits a student's work
# rights: part-time, internships and vacation programs fit; full-time now mostly doesn't; graduate
# programs for after the course fit only if they take temporary visa holders.
#
# The course end is set well in the future so the candidate stays "studying" whenever the eval runs
# (until November 2027): move it on if you run this later.
#
# Labels are a first draft written with the dataset. Review every score and change any you
# disagree with, then set labels_reviewed to true: the eval is only as good as its labels.
id: student_data_au
country: australia
labels_reviewed: false
local_areas: ["Sydney NSW"]

profile:
  personal: {full_name: Priya Raman, city: Kensington, province_state: NSW, country: Australia}
  work_authorization:
    legally_authorized_to_work: "Yes"
    require_sponsorship: "No"
    work_permit_type: Student visa
    course_end: "11/2027"
    study_level: Bachelor's or coursework Master's
    post_study_visa: Temporary Graduate visa (subclass 485)
  availability: {available_for_full_time: "No", available_for_contract: "Yes", willing_to_relocate: "No"}
  compensation: {salary_currency: AUD, salary_range_min: "", salary_expectation: ""}
  experience:
    years_of_experience_total: "2"
    current_job_title: Data Analyst
    target_role: Data Analyst (part-time or internship while studying)
    industry: Software and IT
    field: ""

resume: |
  PRIYA RAMAN
  Kensington, NSW | priya.raman@example.com

  SUMMARY
  Data analyst with 2 years' experience in e-commerce analytics, now studying a Master of Data Science in Sydney.

  EXPERIENCE
  Data Analyst, Kirana Commerce, Bengaluru | Jul 2023 - Jun 2025
  - Built weekly sales and returns dashboards in Power BI for 12 category managers.
  - Wrote SQL (PostgreSQL) to clean and join order data; cut the monthly reporting run from 2 days to 3 hours.
  - Ran A/B test analysis in Python (pandas, SciPy) for checkout changes; one lifted conversion 4%.

  Barista (casual), Corner Bean Cafe, Kensington | Mar 2026 - Present
  - Weekend shifts; trained two new staff on the till and stock counts.

  EDUCATION
  Master of Data Science (coursework), Harbour City University, Sydney | Feb 2026 - Nov 2027 (expected)
  Bachelor of Technology (Computer Science), Coimbatore Institute of Engineering, 2023

  SKILLS
  Analysis: SQL, Python (pandas, NumPy, SciPy), A/B testing, statistics
  Tools: Power BI, Excel, Git, Jupyter

