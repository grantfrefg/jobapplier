name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same PR/branch cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements-desktop.txt pins the job-board scraper the app ships with
        run: pip install -e ".[dev,ui]" -r packaging/requirements-desktop.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'packaging/requirements-desktop.txt') }}

      - name: Install Chromium (browser tests)
        # Browser download only. No --with-deps: GitHub's Ubuntu images already
        # ship Chrome's system libraries, and the apt step it adds stalled on
        # Ubuntu's mirror more than once.
        timeout-minutes: 10
        run: |
          python -m playwright install --no-shell chromium
          # Virtual display for the visible-browser tests (preinstalled on GitHub's images)
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }

      - name: Lint
        # pyflakes + pycodestyle on code that is already clean. Older upstream
        # modules still have pre-existing findings, so they aren't listed yet.
        run: >
          ruff check --select E,F,W
          src/applypilot/ui src/applypilot/desktop.py src/applypilot/__main__.py
          src/applypilot/apply/local_engine.py src/applypilot/apply/answers.py src/applypilot/apply/adapters.py src/applypilot/apply/sites.py src/applypilot/apply/login_browser.py src/applypilot/database.py
          src/applypilot/budget.py src/applypilot/scoring/ats.py src/applypilot/scoring/facts.py src/applypilot/profile_options.py src/applypilot/own_docs.py src/applypilot/llm_anthropic.py src/applypilot/rerun.py src/applypilot/discovery/retry.py src/applypilot/scoring/voice.py src/applypilot/llm_cli.py
          packaging tests

      - name: Test
        # xvfb provides a display so the visible-browser tests run instead of skipping.
        # A stuck test fails the step (keeping its log) instead of the job being
        # cancelled, and faulthandler prints where every thread is after 3 minutes.
        timeout-minutes: 10
        run: xvfb-run -a pytest tests -v -o faulthandler_timeout=180
