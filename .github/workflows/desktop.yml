name: Desktop app

# Builds the double-click ApplyPilot app for Windows and macOS.
#   - Run manually: Actions tab > "Desktop app" > Run workflow
#     (download the zips from the run's "Artifacts" section)
#   - Push a tag like v0.4.0 to also publish them on a GitHub Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: ApplyPilot-Windows
          - os: macos-latest
            label: Mac (Apple Silicon)
            artifact: ApplyPilot-Mac-AppleSilicon
          - os: macos-15-intel
            label: Mac (Intel)
            artifact: ApplyPilot-Mac-Intel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,ui]" -r packaging/requirements-desktop.txt

      - name: Unit tests
        run: pytest tests -q

      - name: Build app
        working-directory: packaging
        run: pyinstaller ApplyPilot.spec --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: python packaging/smoke_test.py packaging/dist/ApplyPilot/ApplyPilot.exe

      - name: Smoke test (Mac)
        if: runner.os == 'macOS'
        run: python packaging/smoke_test.py packaging/dist/ApplyPilot.app/Contents/MacOS/ApplyPilot

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packaging/READ_ME_FIRST_Windows.txt packaging/dist/
          Compress-Archive -Path packaging/dist/ApplyPilot, packaging/dist/READ_ME_FIRST_Windows.txt `
            -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p staging
          cp -R packaging/dist/ApplyPilot.app staging/
          cp packaging/READ_ME_FIRST_Mac.txt staging/
          # ditto keeps the .app's symlinks and code signature intact
          ditto -c -k --sequesterRsrc staging "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
